[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sannce-aio"
version = "0.1.0"
description = "Asyncio library for SANNCE/Tiandy wired IP cameras on the LAN"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/sannce_aio"]
